<style>
:root{--ink:#1c1a1f;--cream:#f0e8e0;--dark:#191a1e;--flav:#ab9ac4;--rv:transparent;--ease:cubic-bezier(.22,.8,.24,1);
--u:min(100vw/1440,100vh/900);--w:calc(100vw/1440);--n:min(100vw/1440,1px);--k:1;--bs:1;--g:rgba(148,189,180,.72);
--sheet:url("https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261116_132032_30242d8c-5062-4d60-8a3d-238f0a2ff788.png&w=2200&q=85");
--mkbg:var(--ink);--mkfg:var(--cream)}
*{box-sizing:border-box;margin:0;padding:0}
body{overflow-x:hidden;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

.spr{background-image:var(--sheet);background-repeat:no-repeat}
.mono{font-family:'DM Mono',ui-monospace,monospace}
#gl{position:fixed;inset:0;width:100vw;z-index:2;pointer-events:none}

/* NAV */
#nav{position:fixed;top:0;left:0;right:0;z-index:50;height:calc(94*var(--n));padding:0 calc(37*var(--n)) 0 calc(42*var(--n));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;color:var(--ink);transform:translateY(-110%);transition:color .4s}

.brand{display:flex;align-items:center;gap:calc(10*var(--n));font-weight:800;letter-spacing:.06em;font-size:calc(15.5*var(--n))}
.mark{width:calc(36*var(--n));height:calc(36*var(--n));display:block}

.pill a.on{font-weight:600}
.hl{position:absolute;top:calc(5*var(--n));bottom:calc(5*var(--n));left:0;width:0;background:#fff;border-radius:99px;transition:left .5s var(--ease),width .5s var(--ease)}
#nav.light .pill{border-color:rgba(28,26,31,.14);background:rgba(255,255,255,.35)}
#nav.dark{color:var(--cream);--mkbg:var(--cream);--mkfg:var(--ink)}

.right{display:flex;gap:calc(8*var(--n));justify-self:end;align-items:center}
.chip{display:flex;align-items:center;justify-content:center;height:calc(37*var(--n));border:1.5px solid currentColor;border-radius:99px;padding:0 calc(14*var(--n));font-size:calc(13*var(--n));font-weight:700;letter-spacing:.04em;position:relative}
.bag{width:calc(44*var(--n));padding:0}.bag svg{width:calc(18*var(--n))}
#badge{position:absolute;top:calc(-7*var(--n));right:calc(-5*var(--n));min-width:18px;height:18px;border-radius:99px;background:var(--ink);color:#fff;font:500 10.5px/18px 'DM Mono',monospace;text-align:center;padding:0 5px;transform:scale(0)}
#badge.has{transform:scale(1)}
.dibs{height:calc(37*var(--n));line-height:calc(37*var(--n));padding:0 calc(18*var(--n));border-radius:99px;background:var(--ink);color:#fff;font-size:calc(14.5*var(--n));font-weight:600;transition:background .4s,color .4s}
#nav.dark .dibs{background:#8fa8a3;color:var(--ink)}

/* INTRO */
#intro{position:fixed;inset:0;z-index:100;background:#ab9ac4;display:flex;align-items:center;justify-content:center}
#intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#intro.gone{display:none}
.skip{position:absolute;z-index:2;top:calc(28*var(--u));right:calc(36*var(--u));height:38px;padding:0 18px;border-radius:99px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:500 12px 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase}
.stamp{display:none;align-items:center;gap:calc(26*var(--u));--mkbg:var(--ink);--mkfg:var(--cream)}
.stamp svg{width:calc(120*var(--u));height:calc(120*var(--u))}

@keyframes stamp{0%{transform:scale(.72);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}

/* HERO */
.hero{position:relative;height:100svh;min-height:300px;overflow:hidden;background:var(--flav)}
.reveal{position:absolute;inset:0;background:var(--rv)}
.rings{position:absolute;left:50%;top:41%;width:calc(2200*var(--u));height:calc(2200*var(--u));translate:-50% -50%;pointer-events:none;
background:repeating-radial-gradient(circle,rgba(255,255,255,.13) 0,rgba(255,255,255,.02) calc(40*var(--u)),rgba(255,255,255,.13) calc(80*var(--u)));
-webkit-mask-image:radial-gradient(circle,#000 0 22%,rgba(0,0,0,.55) 34%,transparent 52%);mask-image:radial-gradient(circle,#000 0 22%,rgba(0,0,0,.55) 34%,transparent 52%)}

@keyframes ringin{from{opacity:0;scale:.85}to{opacity:1;scale:1}}
.bits{position:absolute;inset:0;pointer-events:none}
.bit{position:absolute;translate:-50% -50%;filter:blur(1.5px);opacity:0}

#play{position:absolute;z-index:60;left:50%;top:calc(50% + 200*var(--u));width:calc(52*var(--u));height:calc(52*var(--u));translate:-50% -50%;border-radius:50%;background:#fff;box-shadow:0 6px 20px rgba(40,28,60,.12);display:grid;place-items:center;transition:scale .2s}
#play svg{width:calc(18*var(--u));transition:translate .2s}
#play:hover{scale:1.08}#play:hover svg{translate:2px 0}#play:active{scale:.94}
#title{position:absolute;z-index:60;left:0;right:0;top:calc(50% + 265*var(--u));text-align:center;font-size:calc(96*var(--u));display:grid;pointer-events:none}
.tl{grid-area:1/1;text-align:center}
.tw{display:inline-block;white-space:nowrap}.tc{display:inline-block}
#count{position:absolute;z-index:1;top:calc(50% + 215*var(--u));right:calc((100% - 1440*var(--u))/2 + 28*var(--u));font-size:calc(200*var(--u));line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.9);pointer-events:none}
#auto{position:absolute;z-index:60;right:calc((100% - 1440*var(--u))/2 + 40*var(--u));top:calc(50% + 170*var(--u));display:flex;align-items:center;gap:10px;color:#fff;font:500 11px 'DM Mono',monospace;letter-spacing:.14em}
#auto .ring{width:26px;height:26px;border:1.3px solid #fff;border-radius:50%;display:grid;place-items:center}
#auto svg{width:10px;height:10px;fill:#fff}
#auto .pl{display:none}#auto[aria-pressed=false] .pa{display:none}#auto[aria-pressed=false] .pl{display:block}
html.entered #play{animation:fin .6s .5s both}html.entered #count{animation:fin .6s .62s both}html.entered #auto{animation:fin .6s .74s both}
@keyframes fin{from{opacity:0}to{opacity:1}}

/* SECTION 2 */
#inside{position:relative;height:500vh;background:var(--flav)}

#inBar{position:absolute;left:665px;top:110px;width:330px;height:694px}

.in-icons{position:absolute;left:1292px;top:310px;display:grid;gap:4px;pointer-events:auto}

.in-cap{position:absolute;right:42px;top:596px;text-align:right;font:400 14px/1.6 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.92)}
.storm{position:absolute;inset:0;overflow:hidden}
.piece{position:absolute;left:0;top:0;width:100px;visibility:hidden;transform-origin:50% 50%}

/* SHOP */
#shop{position:relative;background:var(--cream);padding:calc(96*var(--w)) calc(39*var(--w)) calc(80*var(--w))}
.sh-h{font-size:calc(94*var(--w));line-height:.86}
.ln{display:block;overflow:hidden;padding-bottom:.04em}
.ln>span{display:block;transform:translateY(105%);transition:transform 1s var(--ease)}
.in .ln>span{transform:none}.in .ln:nth-child(2)>span{transition-delay:.08s}.in .ln:nth-child(3)>span{transition-delay:.16s}
.sh-cap{position:absolute;left:calc(1128*var(--w));top:calc(132*var(--w));font:400 calc(15.5*var(--w))/1.42 'DM Mono',monospace;opacity:0;translate:0 24px;transition:opacity 1s var(--ease),translate 1s var(--ease)}
.in .sh-cap{opacity:1;translate:0 0}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(18*var(--w));margin-top:calc(24*var(--w))}
.cw{perspective:1200px;opacity:0;translate:0 24px;transition:opacity .9s var(--ease),translate .9s var(--ease)}
.cards.in .cw{opacity:1;translate:0 0}
.card{position:relative;height:calc(390*var(--w));border-radius:calc(22*var(--w));background:var(--c);transform-style:preserve-3d;
transform:translateY(var(--ty,0px)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));transition:transform .5s var(--ease),box-shadow .5s}
.card.tilt{transition:transform .15s,box-shadow .15s;box-shadow:0 24px 40px -18px rgba(40,30,20,.35)}
.nm{position:absolute;left:0;right:0;top:calc(26*var(--w));text-align:center;font-size:calc(30.5*var(--w));line-height:.95;color:#fbf7f2}
.pic{background-repeat:no-repeat;background-size:100% 100%;aspect-ratio:var(--ar)}
.pk{position:absolute;left:50%;top:calc(104*var(--w));width:auto;height:calc(255*var(--w));translate:-50% 0;transform:translateZ(30px);filter:drop-shadow(0 calc(10*var(--w)) calc(12*var(--w)) rgba(30,18,40,.3));cursor:pointer}
.card.live .pk{visibility:hidden}
.add{position:absolute;right:calc(16*var(--w));bottom:calc(15*var(--w));width:max(34px,calc(44*var(--w)));height:max(34px,calc(44*var(--w)));border-radius:50%;background:var(--ink);border:2px solid #fff;display:grid;place-items:center;transform:translateZ(40px);transition:scale .2s}

/* BUILDER */
#range{--pt:max(calc(92*var(--w)),calc((100vh - 540*var(--w))/2));position:relative;background:var(--dark);color:var(--cream);min-height:100svh;overflow:hidden;padding:var(--pt) calc(50*var(--w)) calc(100*var(--w))}
.bd-h{font-size:calc(72.5*var(--w));line-height:.93}
.three{display:inline-block;width:calc(74*var(--w));height:calc(72*var(--w));line-height:calc(72*var(--w));border-radius:calc(14*var(--w));background:var(--cream);color:var(--dark);text-align:center;font-size:.86em;vertical-align:middle;margin-top:-.08em}
.gw{position:absolute;left:calc(740*var(--w));top:calc(var(--pt) - 80*var(--w));width:calc(600*var(--w));height:calc(600*var(--w))}
.glow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--g) 0,color-mix(in srgb,var(--g) 50%,transparent) 32%,transparent 68%)}
.glow.pulse{animation:pulse .6s ease-out}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.slot{position:absolute;width:calc(170*var(--w));height:calc(240*var(--w));translate:-50% -50%;display:grid;place-items:center}
.slot .x{position:absolute;width:calc(48*var(--w));height:calc(48*var(--w));min-width:30px;min-height:30px;border-radius:50%;background:var(--dark);border:2px solid var(--cream);display:grid;place-items:center;transition:transform .5s var(--ease);z-index:2}
.slot .x svg{width:40%;stroke:var(--cream);stroke-width:2;stroke-linecap:round}
.slot.full .x{transform:translateY(calc(-108*var(--w))) scale(.85)}
.slot .bar{width:auto;height:calc(194*var(--w));filter:drop-shadow(0 calc(10*var(--w)) calc(14*var(--w)) rgba(0,0,0,.35))}
.slot:not(.full) .bar{display:none}
.slot.full .bar{animation:rise .55s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(calc(-40*var(--w))) scale(.8)}to{opacity:1;transform:none}}
.thumbs{display:flex;gap:calc(24*var(--w));margin-top:calc(36*var(--w));position:relative;z-index:2}
.th{display:flex;flex-direction:column;align-items:center;gap:calc(10*var(--w));width:calc(107*var(--w))}
.th .sq{position:relative;width:calc(107*var(--w));height:calc(107*var(--w));border-radius:calc(18*var(--w));background:var(--c);display:grid;place-items:center;transition:transform .3s var(--ease)}
.th:hover .sq{transform:translateY(-4px)}
.th .sq .pic{width:auto;height:calc(76*var(--w))}
.th b{font-weight:800;font-size:max(8px,calc(11*var(--w)));text-transform:uppercase;letter-spacing:.04em;text-align:center}
.th .cnt{width:calc(24*var(--w));height:calc(24*var(--w));min-width:18px;min-height:18px;border:1.5px solid rgba(240,232,224,.4);border-radius:50%;display:grid;place-items:center;font:500 calc(11*var(--w))/1 'DM Mono',monospace;font-size:max(9px,calc(11*var(--w)))}
.th .cnt.on{background:var(--cream);color:var(--dark);border-color:var(--cream)}
#buy{position:relative;z-index:2;margin-top:calc(34*var(--w));height:max(44px,calc(54*var(--w)));padding:0 calc(30*var(--w));border-radius:99px;background:var(--cream);color:var(--dark);font-weight:700;font-size:max(14px,calc(16*var(--w)));display:inline-flex;align-items:center;gap:calc(14*var(--w));transition:opacity .3s,background .3s}
#buy:disabled{opacity:.38;cursor:default}#buy.done{background:#8fa8a3;opacity:1}
#buy .pr{font:500 1em 'DM Mono',monospace;opacity:.7}

/* PHONE */

}

<body class="locked">
<canvas id="gl"></canvas>

<header id="nav">
  <a class="brand" href="#flavors"><svg class="mark" viewBox="0 0 36 36"><circle cx="18" cy="18" r="18"/><path d="M7 26 15 13l4.5 6.5 3-4L29 26z"/></svg><span>STRIDE</span></a>
  <nav class="pill" id="pill"><i class="hl" id="hl"></i><a href="#flavors" class="on">Flavors</a><a href="#inside">Inside</a><a href="#shop">Shop</a><a href="#range">Range</a></nav>
  <div class="right">
    <span class="chip off">% OFF</span>
    <button class="chip bag" id="bagBtn" aria-label="Basket"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a1.5 1.5 0 0 1-1.5 1.3H7.7a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg><span id="badge">0</span></button>
    <a class="dibs" href="#range">First dibs</a>
  </div>

b=RM?0:Math.sin(now/4600*2*Math.PI+1.37*j),ak=Math.abs(k);
return{x:g.cx+sg*q(0)*g.u*g.spread,y:cy+q(1)*g.u-(RM?0:(.5*b+.5)*9*g.u),h:q(2)*g.u,rz:sg*q(3)+.4*b,ry:sg*q(4),rx:0,z:-a*34*g.u,op:ak<=3.3?1:clamp(1-(ak-3.3)/.6),sx:1,sy:1,shadow:1}}
const KEYS=['x','y','h','rz','ry','rx','z','op','shadow','sx','sy'];
const lerpS=(a,b,t)=>{const o={};KEYS.forEach(k=>o[k]=lerp(a[k],b[k],t));return o};
let stripDone=false;
function render(now){
const g=heroGeom(),hr=hero.getBoundingClientRect(),cy=hr.top+g.cy,jT=Math.round(target),shopTop=shop.getBoundingClientRect().top;
const p1=clamp(1-st.top/vh),p3=clamp((vh-shopTop)/(.7*vh));st.p1=p1;
let S=arcState(jT-pos,jT,now,g,cy);
if(p1>0&&st.ib){const ib=st.ib,B={x:ib.left+ib.width/2,y:ib.top+ib.height/2+(RM?0:Math.sin(now/2600*2*Math.PI)*6),h:ib.height,rz:14,ry:st.ang+720*(RM?0:st.q),rx:0,z:0,op:1,sx:1,sy:1,shadow:1};
S=lerpS(S,B,sm(p1));
if(p3>0){const c=cardEls[mod(jT,5)],r=c.pk.getBoundingClientRect(),C={x:r.left+r.width/2,y:r.top+r.height/2,h:r.height,rz:0,ry:Math.round(B.ry/360)*360+c.tx*14,rx:-c.ty*14,z:30,op:1,sx:1,sy:1,shadow:.7};
S=lerpS(S,C,sm(p3));
if(innerWidth<820&&!stripDone){stripDone=true;const cw=c.parentElement,strip=cards;strip.scrollTo({left:cw.offsetLeft-(strip.clientWidth-cw.offsetWidth)/2,behavior:'smooth'})}}}
if(st.poke){const t=(now-st.poke.t0)/500;if(t>=1)st.poke=null;else{const P=[[0,1,1],[.3,1.06,.93],[.6,.97,1.04],[1,1,1]];let i=0;while(P[i+1][0]<t)i++;const u=(t-P[i][0])/(P[i+1][0]-P[i][0]);S.sx=lerp(P[i][1],P[i+1][1],u);S.sy=lerp(P[i][2],P[i+1][2],u)}}
const list=[{j:jT,s:S}];
if(hr.bottom>-50){for(let j=Math.floor(pos)-5;j<=Math.floor(pos)+5;j++){if(j===jT)continue;const s=arcState(j-pos,j,now,g,cy);s.op*=1-clamp(1.6*p1);list.push({j,s})}}
bars.forEach((b,i)=>{const it=list[i];if(!it){b.g.visible=b.sh.visible=false;return}b.j=it.j;setFl(b,mod(it.j,5));place(b,it.s)});
renderer.render(scene,camera)}
render.resize=resize;R=render;
const ray=new THREE.Raycaster();
hitBar=(cx,cy)=>{if((st.p1||0)>.02)return null;ray.setFromCamera(new THREE.Vector2(cx/vw*2-1,-(cy/vh)*2+1),camera);
const objs=bars.filter(b=>b.g.visible).flatMap(b=>[b.f,b.b]),h=ray.intersectObjects(objs,false)[0];return h?h.object.userData.bar.j:null};
}catch(e){console.warn('3D unavailable',e)}})();
</script>
